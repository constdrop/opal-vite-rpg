<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Ruby RPG 第5回</title>
</head>
<body>
  <h1>Ruby RPG 第5回 クラスとオブジェクト編</h1>

  <div style="margin-bottom: 10px;">
    <label for="player-name">冒険者の名前：</label>
    <input type="text" id="player-name" placeholder="名前を入力">
  </div>

  <div id="enemy-area" style="background-color: #f0f0f0; padding: 10px; margin-bottom: 10px;">
    <strong>モンスター</strong> <br>
    いまの敵のHP: <span id="enemy-hp">---</span>
  </div>

  <div id="log-area" style="border: 2px solid #333; padding: 10px; height: 200px; overflow-y: scroll; background: #eee;">
    ここにバトルの記録が出ます...
  </div>

  <button id="action-button" style="margin-top: 10px;">冒険に出る！</button>
  <button id="special-button" style="margin-top: 10px;">必殺技！</button>

  <script type="module" src="/app/main_loader.js"></script>
</body>
</html>
