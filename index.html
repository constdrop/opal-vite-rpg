<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Ruby RPG 第7回</title>
</head>
<body>
  <h1>Ruby RPG 第7回 コマンド選択編</h1>

  <div style="margin-bottom: 10px;">
    <label for="player-name">冒険者の名前：</label>
    <input type="text" id="player-name" placeholder="名前を入力">
  </div>

  <div id="player-area" style="background-color: #e0f0ff; padding: 10px; margin-bottom: 10px; border: 1px solid #2196f3;">
    <strong>勇者（あなた）</strong> <br>
    <div style="width: 100%; height: 15px; background-color: #ccc; border-radius: 5px; overflow: hidden; margin: 5px 0;">
      <div id="player-hp-bar" style="width: 100%; height: 100%; background-color: #2196f3; transition: width 0.3s;"></div>
    </div>
    HP: <span id="player-hp">---</span>
  </div>

  <div id="enemy-area" style="background-color: #f0f0f0; padding: 10px; margin-bottom: 10px;">
    <strong>モンスター</strong> <br>
    
    <div style="width: 100%; height: 20px; background-color: #ccc; border-radius: 10px; overflow: hidden;">
      <div id="enemy-hp-bar" style="width: 100%; height: 100%; background-color: #4caf50; transition: width 0.3s;"></div>
    </div>

    いまの敵のHP: <span id="enemy-hp">---</span>
  </div>

  <div id="flash-panel" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; pointer-events: none; transition: opacity 0.1s;"></div>

  <div id="log-area" style="border: 2px solid #333; padding: 10px; height: 200px; overflow-y: scroll; background: #eee;">
    ここにバトルの記録が出ます...
  </div>

  <div id="command-menu" style="display: flex; gap: 10px;">
    <button id="attack-btn" style="padding: 10px 20px;">こうげき</button>
    <button id="heal-btn" style="padding: 10px 20px;">かいふく</button>
  </div>

  <button id="action-button" style="margin-top: 10px;">冒険の準備（リセット）</button>

  <script type="module" src="/app/main_loader.js"></script>
</body>
</html>
